name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          generateReleaseNotes: true
